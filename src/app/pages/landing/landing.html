<p-toast />
<div class="max-w-352 mx-auto px-5 pt-8 pb-16 flex flex-col gap-16">
  <app-hero-section />

  <app-cuti-section
    [startDate]="startDate()"
    [endDate]="endDate()"
    [minEndDate]="minEndDate()"
    [isDateRangeInvalid]="isDateRangeInvalid()"
    [reason]="reason()"
    [isFileUploaded]="isFileUploaded()"
    [submissionMessage]="submissionMessage()"
    [leaveCalculation]="leaveCalculation()"
    [leaveBreakdownItems]="leaveBreakdownItems()"
    (startDateChange)="onStartDateChange($event)"
    (endDateChange)="onEndDateChange($event)"
    (reasonChange)="reason.set($event)"
    (fileSelect)="onFileSelect()"
    (submitSimulation)="onSimulateCutiSubmit()"
  />

  <app-gaji-section
    [monthlyWorkDays]="monthlyWorkDays()"
    [dailySalaryRate]="dailySalaryRate()"
    [approvedLeaveDays]="approvedLeaveDays()"
    [adjustmentType]="adjustmentType()"
    [adjustmentValue]="adjustmentValue()"
    [adjustmentOptions]="adjustmentOptions"
    [salaryBreakdownRows]="salaryBreakdownRows()"
    [salaryNetTotal]="salaryNetTotal()"
    (monthlyWorkDaysChange)="monthlyWorkDays.set($event)"
    (dailySalaryRateChange)="dailySalaryRate.set($event)"
    (approvedLeaveDaysChange)="approvedLeaveDays.set($event)"
    (adjustmentTypeChange)="adjustmentType.set($event)"
    (adjustmentValueChange)="adjustmentValue.set($event)"
  />

  <app-rules-section />

  <app-roles-section />

  <app-footer-section />
</div>
