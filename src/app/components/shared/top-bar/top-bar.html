<header class="layout-topbar" role="banner">
  <div class="layout-topbar-logo-container">
    <button
      type="button"
      class="layout-menu-button layout-topbar-action"
      (click)="layoutService.onMenuToggle()"
      aria-label="Toggle navigation menu"
    >
      <ng-icon name="lucideMenu" size="1.25rem" aria-hidden="true" />
    </button>

    <a class="layout-topbar-logo" routerLink="/" aria-label="Sistem Manajemen Karyawan Beranda">
      <div
        class="w-9 h-9 text-primary-600 dark:text-primary-300 flex items-center justify-center font-bold"
      >
        <ng-icon name="lucideBriefcase" size="2rem" aria-hidden="true" />
      </div>
      <div class="flex flex-col">
        <span
          class="leading-none font-medium tracking-tight text-surface-900 dark:text-surface-0 text-2xl"
        >
          SMKS
        </span>
      </div>
    </a>
  </div>

  <div class="layout-topbar-actions">
    <div class="layout-config-menu">
      <button
        type="button"
        class="layout-topbar-action"
        (click)="toggleDarkMode()"
        [attr.aria-label]="
          layoutService.isDarkTheme() ? 'Ganti ke mode terang' : 'Ganti ke mode gelap'
        "
      >
        @if (layoutService.isDarkTheme()) {
          <ng-icon name="lucideSun" size="1.25rem" aria-hidden="true" />
        } @else {
          <ng-icon name="lucideMoon" size="1.25rem" aria-hidden="true" />
        }
      </button>

      <div class="relative">
        <button
          type="button"
          class="layout-topbar-action layout-topbar-action-highlight"
          pStyleClass="@next"
          enterFromClass="hidden"
          enterActiveClass="animate-scalein"
          leaveToClass="hidden"
          leaveActiveClass="animate-fadeout"
          [hideOnOutsideClick]="true"
          aria-label="Buka konfigurasi tema"
        >
          <ng-icon name="lucidePalette" size="1.25rem" aria-hidden="true" />
        </button>
        <app-configurator />
      </div>
    </div>

    <button
      type="button"
      class="layout-topbar-menu-button layout-topbar-action"
      pStyleClass="@next"
      enterFromClass="hidden"
      enterActiveClass="animate-scalein"
      leaveToClass="hidden"
      leaveActiveClass="animate-fadeout"
      [hideOnOutsideClick]="true"
      aria-label="Buka menu aksi"
    >
      <ng-icon name="lucideEllipsisVertical" size="1.25rem" aria-hidden="true" />
    </button>
  </div>
</header>
